const DATA=[
{id:1,title:'Mots sans grandes difficultés',rule:'Ces mots fréquents ne suivent pas tous une seule règle. Observe les sons, les lettres finales, les voyelles et les petites particularités. On les apprend par familles et par répétitions.',examples:'amour · minute · sucre',words:'abri|amour|avion|barbe|bonjour|date|groupe|ligne|maladie|mine|minute|or|pie|poudre|retenir|rire|son|sorte|sucre|tour|vivre|vue'.split('|')},
{id:2,title:'Règle de la lettre crochet',rule:'Une lettre finale qu’on n’entend pas dans certains mots devient audible dans une forme féminine ou dans un mot de la même famille : grand → grande, court → courte, renard → renarde. Attention : cela ne s’applique pas à tous les mots.',examples:'court → courte · mort → morte · renard → renarde',words:'court|courte|droit|droite|gentil|gentille|haut|haute|méchant|méchante|mort|morte|ouvert|ouverte|rat|rate|renard|renarde|rond|ronde'.split('|')},
{id:3,title:'Mots se terminant par une lettre muette',rule:'Dans plusieurs mots, la dernière lettre ne se prononce pas : bord, long, doigt, point. Une forme apparentée peut parfois aider : long → longue; bord → bordure. Certains mots doivent surtout être mémorisés.',examples:'long → longue · bord → bordure · doigt → doigté',words:'goût|bord|but|doigt|fond|long|nid|part|point|pot|retard|sabot|salut|soie|sourcil'.split('|')},
{id:4,title:'Règle cerf ou caméléon ?',rule:'La lettre c a souvent le son doux [s] devant e, i ou y (cerf, cinéma), et le son dur [k] devant a, o ou u (cause, conte, cuisine). La cédille ç conserve le son [s] devant a, o ou u (garçon).',examples:'cinéma · cause · cuisine · lancer',words:'cause|cinéma|commencer|congé|conte|continuer|cuisine|écouter|glace|lancer|naissance|occuper|pièce|précipiter|raconter|secouer|surface'.split('|')},
{id:5,title:'Règle ange ou dragon ?',rule:'La lettre g a souvent le son doux [j] devant e, i ou y (genre, girafe) et le son dur [g] devant a, o ou u (garder, gorge). Pour garder le son dur devant e ou i, on utilise souvent gu (guerre, langue). Observe aussi les accents et les lettres doubles.',examples:'genre · garder · guerre · gorge',words:'âge|argent|danger|gagner|garder|genre|gorge|goutte|guerre|langue|magasin|ménage|nuage|protéger|village|voyage'.split('|')},
{id:6,title:'Règle histoire de poisson',rule:'Observe le son [s] et ses différentes écritures. On écrit souvent ss entre deux voyelles pour conserver le son [s], comme dans poisson, glisser et laisser. Une seule lettre s entre deux voyelles se prononce souvent [z], comme dans poser ou visite. Le c, le ç et le sc peuvent aussi donner le son [s].',examples:'poisson · glisser · poser · descendre',words:'choisir|consoler|course|danser|descendre|église|glisser|laisser|passage|poser|posséder|pousser|présenter|réussir|trésor|usine|visite|vitesse'.split('|')},
{id:7,title:'Les mots contenant le son [o]',rule:'Le son [o] s’écrit notamment o (radio), au (hauteur, sauver) ou eau (nouveau, oiseau). Compare ces façons d’écrire le même son et retiens aussi les lettres finales ou doubles.',examples:'radio · hauteur · nouveau · oiseau',words:'aussitôt|déposer|faire|hauteur|nouveau|octobre|offrir|oiseau|poche|promener|promettre|radio|restaurant|sauver'.split('|')},
{id:8,title:'Les mots contenant le son [an]',rule:'Le son nasal [ɑ̃] peut s’écrire an (danser), en (entrer, lentement), am ou em devant certaines lettres (comme dans chambre et emporter). Observe précisément les lettres de chaque mot : certains mots de cette liste ont aussi d’autres difficultés.',examples:'apprendre · enfant · bande · lentement',words:'appartement|apprendre|attention|avancer|bande|changer|courant|demande|entrer|environ|janvier|lentement|pantalon|pencher|plan|rencontrer|rendre|reprendre|santé|sentier|ventre|viande'.split('|')},
{id:9,title:'Les mots contenant le son [in] ou [ain]',rule:'Le son nasal de lapin peut s’écrire in (pin, sapin), ain (bain, prochain), ein (certains mots) ou parfois im devant b ou p. Observe les lettres exactes : bien et rien s’écrivent ien et leur prononciation n’est pas tout à fait celle de pin.',examples:'pin · bain · prochain · sapin',words:'bain|bien|certain|chagrin|faim|invitation|lendemain|patin|pin|poussin|prochain|rejoindre|rien|sapin|soin|terrain'.split('|')},
{id:10,title:'Règle Monsieur Champion',rule:'Devant b, m ou p, le son an s’écrit généralement am ou em plutôt que an ou en : champ, jambe, ensemble, important. Il existe des exceptions. Il faut regarder les lettres voisines et repérer les consonnes doubles.',examples:'champ · jambe · ensemble · important',words:'ampoule|champ|comprendre|compter|décembre|embrasser|ensemble|exemple|important|importante|jambe|longtemps|nombre|novembre|ombre|remplir|sembler|septembre'.split('|')},
{id:11,title:'Les mots contenant le son [f]',rule:'Le son f s’écrit généralement f (fille, fou) mais parfois ph (photo, téléphone, alphabet). Observe aussi les doubles consonnes et les accents de certains mots.',examples:'fil · photo · alphabet · téléphone',words:'alphabet|février|fil|film|fleuve|fol|folle|fou|frapper|photo|préféré|téléphone'.split('|')},
{id:12,title:'Règle la bonne clé',rule:'Le son k s’écrit souvent c devant a, o ou u (camion, costume), qu devant e ou i (quelle, question) et parfois d’autres graphies. Observe les groupes de lettres qui produisent le son k, sans oublier les accents et les consonnes doubles.',examples:'camion · costume · quelle · question',words:'cacher|camion|coin|costume|couleur|courir|crise|découvrir|manquer|parc|plastique|presque|quelle|quelles|quels|question|spectacle'.split('|')}

function startTest(n){const l=list();test={words:pickRandom(l.words,Math.min(n,l.words.length)),index:0,answers:[],stage:'show',visible:true};page='test';render();testTimer()}
function testTimer(){stopTimer();if(test&&test.stage==='show'){const sec=Number(state.delay)||8;hideTimer=setTimeout(()=>{if(page==='test'&&test&&test.stage==='show'){test.stage='type';test.visible=false;render()}},sec*1000)}}
function testAdvance(){const l=list();const v=document.getElementById('testinput')?.value.trim()||'';if(!v){alert('Écris un mot avant de continuer.');return}test.answers.push({word:test.words[test.index],typed:v,ok:v.toLocaleLowerCase('fr-CA')===test.words[test.index]});test.index++;if(test.index>=test.words.length){const entry={date:new Date().toISOString(),answers:test.answers,score:test.answers.filter(x=>x.ok).length,total:test.answers.length};(state.tests[l.id]||(state.tests[l.id]=[])).push(entry);save();test.stage='done'}else{test.stage='show';test.visible=true}render();if(test.stage==='show')testTimer()}
function renderTest(){const l=list();if(!test){navList();return}if(test.stage==='done'){const last=state.tests[l.id].at(-1);const lastIndex=state.tests[l.id].length-1;reviewContext={listId:l.id,index:lastIndex};root.innerHTML=`<section class="card"><h2>🏆 Mode Contrôle terminé — Liste ${l.id}</h2><div class="focus"><div class="target">${last.score}/${last.total}</div><p>1 point par mot écrit exactement, accents compris.</p></div><div class="tablewrap"><table><thead><tr><th>Mot attendu</th><th>Ta réponse</th><th>Résultat</th><th>Révision</th></tr></thead><tbody>${last.answers.map(a=>`<tr><td>${html(a.word)}</td><td>${html(a.typed)}</td><td>${a.ok?'✓ 1 point':'↻ 0 point'}</td><td>${a.ok?'—':`<button data-revise="${html(a.word)}">Découvrir et corriger</button>`}</td></tr>`).join('')}</tbody></table></div><div class="actions">${button('Corriger les erreurs','review','primary')}${button('Nouveau contrôle','list')}${button('Voir la progression','history')}</div></section>`;return}
const w=test.words[test.index];let box=test.stage==='show'?`<div class="focus"><p class="muted">Observe le mot. Il disparaîtra dans ${Number(state.delay)||8} secondes.</p><div class="target">${html(w)}</div></div><div class="actions">${button('Cacher maintenant','hide')}${speakButton(w)}</div>`:`<div class="focus"><p class="muted">Écris le mot sans indice. Aucune correction avant la fin du contrôle.</p><form id="testform"><label class="sr" for="testinput">Mot à écrire</label><input id="testinput" spellcheck="false" autocomplete="off" autocapitalize="none" placeholder="Ton mot…"><button class="primary" type="submit">Valider et continuer →</button></form><div class="actions" style="justify-content:center">${speakButton(w)}</div></div>`;
root.innerHTML=`<section class="card"><div class="row between"><h2>🎯 Mode Contrôle — Liste ${l.id}</h2><span class="pill">Mot ${test.index+1}/${test.words.length}</span></div><p class="muted">Une nouvelle séance sera enregistrée à la fin. ${test.stage==='show'?'':'Le modèle reste caché.'}</p>${box}<div class="actions">${button('Abandonner ce contrôle','abort','danger')}</div></section>`;if(test.stage==='type')document.getElementById('testinput')?.focus()}
function renderHistory(){
 const l=list(), tests=state.tests[l.id]||[],checks=allChecks(l),last=tests.at(-1);
 const attemptsByWord=l.words.map(w=>({w, r:rec(l,w), c:checksFor(l,w)}));
 const repeated=attemptsByWord.filter(x=>x.c.length>=2);
 const improved=checks.filter(a=>!a.ok&&corrected(l,a.testIndex,a.word)).length;
 const firsts=checks.filter(a=>!checks.some(b=>b.word===a.word&&b.testIndex<a.testIndex));
 const lastIndex=tests.length-1;const lastWrong=last?last.answers.filter(a=>!a.ok):[];const remain=lastWrong.filter(a=>!corrected(l,lastIndex,a.word));
 const totals=tests.filter(t=>t.total===l.words.length);
 const compare=totals.length>=2?`<p class="status">Contrôles complets : ${totals.at(-2).score}/${l.words.length} → <b>${totals.at(-1).score}/${l.words.length}</b> (${totals.at(-1).score-totals.at(-2).score>=0?'+':''}${totals.at(-1).score-totals.at(-2).score} point(s)).</p>`:`<p class="muted">Pour comparer deux contrôles complets, recommence un contrôle de toute la liste. Les contrôles courts peuvent contenir des mots différents.</p>`;
 root.innerHTML=`<section class="card"><div class="row between"><h2>📈 Bilan et progression — Liste ${l.id}</h2>${button('← Revenir à la liste','list')}</div>
 <p class="muted">Les exercices d'apprentissage et les contrôles sont enregistrés séparément. Les contrôles comptent uniquement les mots de cette liste : 1 point pour un mot exactement écrit.</p>
 <div class="statgrid"><div class="stat">Pratiqués en apprentissage<strong>${count(l)}/${l.words.length}</strong></div><div class="stat">Mots évalués en contrôle<strong>${new Set(checks.map(a=>a.word)).size}/${l.words.length}</strong></div><div class="stat">Dernier contrôle<strong>${last?last.score+'/'+last.total:'—'}</strong></div><div class="stat">Contrôles terminés<strong>${tests.length}</strong></div><div class="stat">Erreurs encore à corriger<strong>${remain.length}</strong></div><div class="stat">Erreurs corrigées après contrôle<strong>${improved}</strong></div></div>
 <h3 style="margin-top:20px">Dernier contrôle : mots à revoir</h3>${lastWrong.length?button('Corriger les erreurs de ce contrôle','review','primary'):''}${!last?'<p class="muted">Aucun contrôle terminé.</p>':lastWrong.length?`<p class="muted">Clique sur « Découvrir » pour revoir les particularités avant de réécrire le mot.</p><div class="tablewrap"><table><thead><tr><th>Mot attendu</th><th>Ta réponse</th><th>État</th><th>Revoir</th></tr></thead><tbody>${lastWrong.map(a=>`<tr><td><strong>${html(a.word)}</strong></td><td class="wrong">${html(a.typed)}</td><td>${corrected(l,lastIndex,a.word)?'<span class="corrected">✓ Corrigé correctement</span>':'À corriger'}</td><td><button data-revise="${html(a.word)}">🔎 Découvrir</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="status success">Bravo ! Aucun mot incorrect dans le dernier contrôle.</p>'}
 <h3 style="margin-top:20px">Historique des contrôles</h3>${compare}${tests.length?`<div class="tablewrap"><table><thead><tr><th>Contrôle</th><th>Date</th><th>Pointage</th><th>Réussite</th><th>Détails</th></tr></thead><tbody>${tests.map((t,i)=>`<tr><td>N° ${i+1}${t.total===l.words.length?' · complet':''}</td><td>${new Date(t.date).toLocaleString('fr-CA')}</td><td><b>${t.score}/${t.total}</b></td><td>${Math.round(100*t.score/t.total)} %</td><td><button data-history="${i}">Voir les mots</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aucun contrôle enregistré.</p>'}
 <h3 style="margin-top:20px">Résultats par mot — Apprentissage ET Contrôles</h3><p class="muted">Les deux colonnes de droite montrent l'évolution lors des contrôles. « Premier » et « dernier » représentent le premier et le dernier passage de ce mot en contrôle.</p><div class="tablewrap"><table><thead><tr><th>Mot</th><th>Essais libres</th><th>Dernier essai libre</th><th>Contrôles</th><th>Premier contrôle</th><th>Dernier contrôle</th><th>Action</th></tr></thead><tbody>${attemptsByWord.map(({w,r,c})=>`<tr><td>${html(w)}</td><td>${r.tries}</td><td>${r.last===null?'—':r.last?'✓':'À revoir'}</td><td>${c.length}</td><td>${!c.length?'—':c[0].ok?'✓':'À revoir'}</td><td class="${c.length&&!c.at(-1).ok?'wrong':''}">${!c.length?'—':c.at(-1).ok?'✓':'À revoir'}</td><td><button data-revise="${html(w)}">Découvrir</button></td></tr>`).join('')}</tbody></table></div></section>`;
}
function historyDetail(i){const l=list(),t=(state.tests[l.id]||[])[i];if(!t){page='history';render();return}root.innerHTML=`<section class="card"><div class="row between"><h2>Contrôle n° ${i+1} — ${new Date(t.date).toLocaleString('fr-CA')}</h2>${button('← Bilan','history')}</div><div class="statgrid"><div class="stat">Pointage<strong>${t.score}/${t.total}</strong></div><div class="stat">Réussite<strong>${Math.round(100*t.score/t.total)} %</strong></div><div class="stat">Mots à revoir<strong>${t.total-t.score}</strong></div></div><p class="muted">Les réponses de ce contrôle sont conservées telles qu'elles ont été saisies.</p><div class="tablewrap"><table><thead><tr><th>Mot attendu</th><th>Réponse écrite</th><th>Point</th><th>Correction ultérieure</th><th>Découverte</th></tr></thead><tbody>${t.answers.map(a=>`<tr><td>${html(a.word)}</td><td class="${a.ok?'':'wrong'}">${html(a.typed)}</td><td>${a.ok?'✅ 1':'❌ 0'}</td><td>${a.ok?'—':corrected(l,i,a.word)?'<span class="corrected">✓ Corrigé</span>':'À revoir'}</td><td><button data-revise="${html(a.word)}">Revoir</button></td></tr>`).join('')}</tbody></table></div><div class="actions">${button('← Revenir au bilan','history','primary')}</div></section>`}
function settings(){return `<section class="card"><div class="row between"><div><h3>⚙️ Options de mémorisation</h3><p class="muted">Durée d'observation : automatique pour un contrôle, ou manuelle pendant l'entraînement.</p></div><label>Masquage <select id="delay"><option value="0" ${state.delay==='0'?'selected':''}>Manuel (contrôle : 8 s)</option><option value="5" ${state.delay==='5'?'selected':''}>5 secondes</option><option value="10" ${state.delay==='10'?'selected':''}>10 secondes</option><option value="15" ${state.delay==='15'?'selected':''}>15 secondes</option></select></label></div><p class="tiny">Le bouton vocal dépend du navigateur et des voix françaises disponibles sur l'appareil. La grille n'apparaît jamais durant l'écriture.</p></section>`}
function render(){if(page==='home')renderHome();if(page==='list')renderList();if(page==='word')renderWord();if(page==='test')renderTest();if(page==='history')renderHistory();if(page==='review')renderReview();if(page==='list')root.insertAdjacentHTML('beforeend',settings());}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-list],[data-word],[data-history],[data-revise]');if(!b)return;if(b.dataset.list){chooseList(Number(b.dataset.list));return}if(b.dataset.word){selectWord(b.dataset.word);return}if(b.dataset.history!==undefined){page='detail';historyDetail(Number(b.dataset.history));return}if(b.dataset.revise!==undefined){if(!reviewContext){const l=list(),ts=state.tests[l.id]||[];reviewContext={listId:l.id,index:ts.length-1}}selectWord(b.dataset.revise);return}const a=b.dataset.act;if(a==='home')navHome();else if(a==='list')navList();else if(a==='memory')enterMemory();else if(a==='write'){stopTimer();phase='write';visible=false;feedback=null;render()}else if(a==='toggle'){visible=!visible;stopTimer();render()}else if(a==='speak'){const w=page==='test'&&test?test.words[test.index]:active;if(w)say(w)}else if(a==='retry')enterMemory();else if(a==='reset')resetList();else if(a==='test5')startTest(5);else if(a==='test8')startTest(8);else if(a==='testall')startTest(list().words.length);else if(a==='hide'){stopTimer();test.stage='type';render()}else if(a==='abort'){if(confirm('Abandonner ce contrôle non terminé ? Aucun résultat ne sera ajouté.'))navList()}else if(a==='history'){test=null;page='history';render()}else if(a==='review'){stopTimer();active=null;if(!reviewContext||reviewContext.listId!==state.current){const ts=state.tests[list().id]||[];reviewContext={listId:list().id,index:ts.length-1}}page='review';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='wordform'){e.preventDefault();answer=document.getElementById('typed').value.trim();if(!answer)return;const ok=answer.toLocaleLowerCase('fr-CA')===active;recordWord(list(),active,ok);feedback={correct:ok};render()}if(e.target.id==='testform'){e.preventDefault();testAdvance()}});
document.addEventListener('change',e=>{if(e.target.id==='delay'){state.delay=e.target.value;save()}});
document.getElementById('home').addEventListener('click',navHome);render();
</script></body></html>
